<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>Files</title>
  <defs>
    <filter id="enz-files-drop" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dy="2" result="blur"/>
      <feComponentTransfer in="blur" result="shadow">
        <feFuncA type="linear" slope="0.28"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- landscape keyline; folder 88 x 76 (20..108 x 28..104); back ends under the flap; handle line on the flap -->
  <g filter="url(#enz-files-drop)">
    <path d="M29 28 H45 Q48.5 28 51 30.5 L54.5 34 H99 A9 9 0 0 1 108 43 V64 H20 V37 A9 9 0 0 1 29 28 Z" fill="#EE8C22"/>
    <rect x="28" y="38" width="72" height="40" rx="4" fill="#C9D3E2" transform="rotate(-5 64 58)"/>
    <rect x="28" y="40" width="72" height="40" rx="4" fill="#FFFFFF"/>
    <rect x="28" y="45" width="72" height="3" fill="#000000" fill-opacity="0.07"/>
    <path d="M20 57 A9 9 0 0 1 29 48 H99 A9 9 0 0 1 108 57 V95 A9 9 0 0 1 99 104 H29 A9 9 0 0 1 20 95 Z" fill="#FFB43C"/>
  </g>
  <rect x="52" y="58" width="24" height="6" rx="3" fill="#E58A1C"/>
</svg>
